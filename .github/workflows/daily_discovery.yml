name: UAE Report Discovery

on:
  schedule:
    # 06:00 Gulf Standard Time (UTC+4) = 02:00 UTC. Adjust as needed.
    - cron: "0 2 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run discovery pipeline
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m discovery.main

      - name: Commit updated inbox
        run: |
          git config user.name "uae-report-discovery-bot"
          git config user.email "actions@github.com"
          git add data/discovery_inbox.csv
          git diff --staged --quiet || git commit -m "Discovery run: $(date -u +'%Y-%m-%d')"
          git push

      - name: Post digest as an Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const digest = fs.readFileSync('data/latest_digest.md', 'utf8');
            // Skip creating an issue on days with nothing new, to avoid noise
            if (digest.includes('No new reports found today')) {
              console.log('Nothing new today — skipping issue creation.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `UAE Report Discovery — ${new Date().toISOString().slice(0,10)}`,
              body: digest,
              labels: ['report-discovery']
            });
